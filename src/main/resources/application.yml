spring:
  application:
    name: archive-poc
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/archive
    username: archive
    password: archive
    hikari:
      # Pin every pooled connection to UTC so pg_partman aligns partition bounds
      # on UTC day boundaries regardless of the JVM-local timezone. Without this,
      # a CEST-running app would create partitions on +02 boundaries while a
      # UTC-running replica would create UTC-aligned ones — instant overlap.
      connection-init-sql: "SET TIME ZONE 'UTC'"
  flyway:
    enabled: true
  jpa:
    # Flyway is the single source of truth for DDL — never let Hibernate touch the schema.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      # Match the Hikari connection-init-sql so OffsetDateTime values bind in UTC
      # and partition routing aligns with the UTC-pinned partition bounds.
      hibernate.jdbc.time_zone: UTC

archive:
  retention: P7D
  bucket: archive-bucket
  interval: 60s

aws:
  region: us-east-1
  # 'test'/'test' are the well-known LocalStack dummy credentials, not real secrets.
  # Real AWS deployments should remove these and let the SDK's default credentials
  # provider chain (environment, instance profile, etc.) take over.
  access-key: test
  secret-key: test
  s3:
    # endpoint-override + path-style-access target LocalStack. For real AWS,
    # unset endpoint-override and set path-style-access: false (path-style is
    # being phased out for the Amazon S3 service).
    endpoint-override: http://localhost:4566
    path-style-access: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
